<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevOps Lab — Mubita's Workshop</title>
<style>
  :root { --navy:#002460; --blue:#006CB4; --teal:#009CA8; --bg:#f5f7fa; --card:#fff; --text:#1b2430; --muted:#5b6673; --ok:#1e8e3e; --bad:#c5221f; --line:#e1e6ec; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Segoe UI", Calibri, sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--navy); color:#fff; padding:18px 28px; display:flex; align-items:center; gap:14px; }
  header .brand { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#9fd3d9; }
  header h1 { margin:0; font-size:20px; font-weight:600; }
  main { max-width:900px; margin:28px auto; padding:0 20px; display:grid; gap:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px 22px; }
  .card h2 { margin:0 0 10px; font-size:15px; color:var(--blue); font-weight:600; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  button { background:var(--blue); color:#fff; border:0; border-radius:6px; padding:9px 16px; font-size:14px; cursor:pointer; }
  button.secondary { background:#fff; color:var(--blue); border:1px solid var(--blue); }
  button.danger { background:#fff; color:var(--bad); border:1px solid var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  input, select { padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:14px; }
  .kv { display:grid; grid-template-columns: 140px 1fr; gap:6px 14px; font-size:14px; }
  .kv dt { color:var(--muted); } .kv dd { margin:0; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; }
  .pill.ok { background:#e6f4ea; color:var(--ok); } .pill.bad { background:#fce8e6; color:var(--bad); } .pill.wait { background:#e8f0fe; color:var(--blue); }
  .checks { display:grid; gap:8px; margin-top:10px; }
  .check { display:grid; grid-template-columns: 24px 130px 1fr; gap:10px; align-items:start; font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:6px; }
  .check code { font-size:12px; color:var(--muted); word-break:break-all; }
  .log { font-family: Consolas, Menlo, monospace; font-size:12px; background:#0f1b2d; color:#cfe3f3; padding:12px; border-radius:6px; max-height:220px; overflow:auto; white-space:pre-wrap; }
  .muted { color:var(--muted); font-size:13px; }
  a { color:var(--blue); }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:20px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="brand">Mubita's Workshop</div>
    <h1>DevOps Lab</h1>
  </div>
</header>
<main>
  <section class="card">
    <h2>Connection</h2>
    <div class="row">
      <button id="btnSignIn">Sign in</button>
      <span id="who" class="muted" style="display:none"><strong id="whoName"></strong> <span id="whoRole" class="pill ok"></span></span>
      <button class="secondary" id="btnSignOut" style="display:none">Sign out</button>
      <label id="actAs" style="display:none">Act as learner <input id="learner" value="" size="10"></label>
      <label>Lab
        <select id="lab">
          <option value="01-golden-path-tenant" selected>01 — The Golden Path (your own environment)</option>
          <option value="01-golden-path">01 — The Golden Path (shared sandbox, instructor demo)</option>
        </select>
      </label>
      <button class="secondary" id="btnHealth">Check agent</button>
      <span id="health" class="muted"></span>
    </div>
    <details id="cli" style="margin-top:10px">
      <summary class="muted">Advanced: agent address / CLI token (break-glass, no sign-in)</summary>
      <div class="row" style="margin-top:8px">
        <label>Agent <input id="agent" value="http://localhost:8900" size="30"></label>
        <label>Token <input id="token" type="password" value="" size="14" autocomplete="off"></label>
        <label>Learner <input id="cliLearner" value="local" size="10"></label>
      </div>
    </details>
  </section>

  <section class="card">
    <h2>Your environment</h2>
    <div class="row" style="margin-bottom:12px">
      <button id="btnProvision">Provision</button>
      <button class="secondary" id="btnStatus">Refresh</button>
      <button class="secondary" id="btnGrade">Grade</button>
      <button class="secondary" id="btnResetRepo">Reset repo</button>
      <button class="secondary" id="btnResetAll">Reset all</button>
      <button class="secondary" id="btnFixture">Apply fixture: broken-test</button>
      <button class="danger" id="btnDeprovision">Deprovision</button>
      <span id="busy" class="pill wait" style="display:none">working…</span>
    </div>
    <dl class="kv" id="env"><dt>State</dt><dd class="muted">not provisioned — click Provision</dd></dl>
  </section>

  <section class="card" id="gradeCard" style="display:none">
    <h2>Last grade <span id="score" class="pill"></span></h2>
    <div class="checks" id="checks"></div>
    <p class="muted" id="gradedAt"></p>
  </section>

  <section class="card">
    <h2>Activity</h2>
    <div class="log" id="log"></div>
  </section>
</main>
<footer>DevOps Lab tile · sign-in by Keycloak · talks only to the devops-agent · Mubita Digital</footer>

<script>
const $ = id => document.getElementById(id);
const log = (m, obj) => { const t = new Date().toLocaleTimeString(); $('log').textContent = `[${t}] ${m}${obj ? '\n' + JSON.stringify(obj, null, 2) : ''}\n` + $('log').textContent; };
const base = () => $('agent').value.replace(/\/$/, '');

// ---- Sign-in (Keycloak, authorization code + PKCE, no library) ----------------------------
const KC = { url: 'https://devops-auth.mubita.digital', realm: 'workshop', client: 'devops-tile' };
const PUBLIC_AGENT = 'https://devops-agent.mubita.digital';
const kcBase = () => `${KC.url}/realms/${KC.realm}/protocol/openid-connect`;
const redirectUri = () => location.origin + location.pathname;
const session = { get: () => JSON.parse(sessionStorage.getItem('kc') || 'null'), set: v => sessionStorage.setItem('kc', JSON.stringify(v)), clear: () => sessionStorage.removeItem('kc') };
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const rand = () => b64url(crypto.getRandomValues(new Uint8Array(32)));
const claims = t => JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
async function signIn() {
  const verifier = rand(), state = rand();
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  sessionStorage.setItem('pkce', JSON.stringify({ verifier, state }));
  const q = new URLSearchParams({ client_id: KC.client, response_type: 'code', scope: 'openid', redirect_uri: redirectUri(), state, code_challenge: challenge, code_challenge_method: 'S256' });
  location.assign(`${kcBase()}/auth?${q}`);
}
async function tokenRequest(params) {
  const r = await fetch(`${kcBase()}/token`, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ client_id: KC.client, ...params }) });
  const d = await r.json(); if (!r.ok) throw new Error(d.error_description || d.error || `token ${r.status}`);
  session.set({ access: d.access_token, refresh: d.refresh_token, id: d.id_token, exp: Date.now() + d.expires_in * 1000 });
  return session.get();
}
async function finishSignIn() {              // back from Keycloak with ?code=…&state=…
  const u = new URL(location.href), code = u.searchParams.get('code'), state = u.searchParams.get('state');
  if (!code) return;
  const pk = JSON.parse(sessionStorage.getItem('pkce') || '{}'); sessionStorage.removeItem('pkce');
  history.replaceState({}, '', redirectUri());
  if (state !== pk.state) { log('sign-in failed: state mismatch'); return; }
  try { await tokenRequest({ grant_type: 'authorization_code', code, redirect_uri: redirectUri(), code_verifier: pk.verifier }); log('signed in'); }
  catch (e) { log('sign-in failed', e.message); }
}
async function accessToken() {               // refresh when < 30 s left
  const s = session.get(); if (!s) return null;
  if (Date.now() < s.exp - 30000) return s.access;
  try { return (await tokenRequest({ grant_type: 'refresh_token', refresh_token: s.refresh })).access; }
  catch (e) { log('session expired — sign in again'); session.clear(); renderWho(); return null; }
}
function signOut() {
  const s = session.get(); session.clear(); renderWho();
  if (s && s.id) location.assign(`${kcBase()}/logout?${new URLSearchParams({ id_token_hint: s.id, post_logout_redirect_uri: redirectUri() })}`);
}
let me = null;                               // {learner, roles, instructor} from the agent, when signed in
function renderWho() {
  const s = session.get(); const on = !!s;
  $('btnSignIn').style.display = on ? 'none' : ''; $('btnSignOut').style.display = on ? '' : 'none'; $('who').style.display = on ? '' : 'none';
  $('cli').style.display = on ? 'none' : '';
  if (on) { const c = claims(s.access); $('whoName').textContent = c.preferred_username; const roles = (c.roles || (c.realm_access || {}).roles || []); const inst = roles.includes('instructor'); $('whoRole').textContent = inst ? 'instructor' : 'learner'; $('actAs').style.display = inst ? '' : 'none'; if (!$('learner').value) $('learner').value = c.preferred_username; }
  else { $('actAs').style.display = 'none'; me = null; }
}
const currentLearner = () => session.get() ? ($('actAs').style.display === 'none' ? claims(session.get().access).preferred_username : ($('learner').value || claims(session.get().access).preferred_username)) : $('cliLearner').value;
async function bearer() { return session.get() ? await accessToken() : $('token').value; }
// --------------------------------------------------------------------------------------------

const hdr = async (json) => ({ 'Authorization': 'Bearer ' + (await bearer()), ...(json ? { 'Content-Type': 'application/json' } : {}) });
const envPath = () => `/v1/envs/${encodeURIComponent(currentLearner())}/${encodeURIComponent($('lab').value)}`;
const busy = on => { $('busy').style.display = on ? '' : 'none'; document.querySelectorAll('button').forEach(b => b.disabled = on); };
async function call(method, path, body) {
  const r = await fetch(base() + path, { method, headers: await hdr(!!body), body: body ? JSON.stringify(body) : undefined });
  let data; try { data = await r.json(); } catch { data = { error: 'no-json', status: r.status }; }
  if (!r.ok) throw Object.assign(new Error(`${method} ${path} → ${r.status}`), { data });
  return data;
}
const pill = (el, text, cls) => { el.textContent = text; el.className = 'pill ' + cls; };
function renderEnv(e) {
  const rows = [
    ['State', `<span class="pill ${e.state === 'ready' ? 'ok' : 'wait'}">${e.state}</span>`],
    ['Repo', `<a href="${e.urls.gitea}" target="_blank">${e.owner}/${e.repo}</a> · <a href="${e.urls.actions}" target="_blank">pipeline runs</a>`],
    ...(e.gitea_access && e.gitea_access !== 'n/a' ? [['Gitea access', e.gitea_access === 'owner'
        ? `<span class="pill ok">owner</span> <span class="muted">you can open the repo and pipeline logs — sign in to Gitea with the same account</span>`
        : `<span class="pill wait">pending</span> <span class="muted">first <a href="${e.urls.gitea_signin}" target="_blank">sign in to Gitea</a> with your Keycloak account, then click Refresh</span>`]] : []),
    ['Namespace', e.namespace],
    ['Head', `<code>${e.head}</code>`],
    ['App', e.urls.app ? `<a href="${e.urls.app}" target="_blank">${e.urls.app}</a>` : '—'],
    ['Provisioned', new Date(e.provisioned_at).toLocaleString()],
    ['Expires', new Date(e.expires_at).toLocaleDateString()],
  ];
  if (e.last_grade) rows.push(['Last grade', `<span class="pill ${e.last_grade.score === e.last_grade.of ? 'ok' : 'bad'}">${e.last_grade.score} / ${e.last_grade.of}</span> <span class="muted">${new Date(e.last_grade.at).toLocaleString()}</span>`]);
  $('env').innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
}
function renderGrade(g) {
  $('gradeCard').style.display = '';
  pill($('score'), `${g.score} / ${g.of}`, g.score === g.of ? 'ok' : 'bad');
  $('checks').innerHTML = g.checks.map(c => `<div class="check"><span>${c.ok ? '✅' : '❌'}</span><strong>${c.kind}</strong><code>${JSON.stringify(c.evidence)}</code></div>`).join('');
  $('gradedAt').textContent = 'Graded ' + new Date(g.graded_at).toLocaleString() + ' · head ' + g.head;
}
async function refresh(quiet) {
  try { const e = await call('GET', envPath()); renderEnv(e); if (!quiet) log('status', e); }
  catch (err) { if (err.data && err.data.detail && err.data.detail.error === 'not_found') { $('env').innerHTML = '<dt>State</dt><dd class="muted">not provisioned — click Provision</dd>'; if (!quiet) log('no environment yet'); } else { log('status failed', err.data || err.message); } }
}
async function pollJob(id) {
  for (let i = 0; i < 120; i++) {
    const j = await call('GET', `/v1/jobs/${id}`);
    if (j.state === 'done' || j.state === 'failed') return j;
    await new Promise(r => setTimeout(r, 1000));
  }
  throw new Error('job timed out');
}
async function run(label, fn) {
  busy(true); log(label + '…');
  try { await fn(); } catch (err) { log(label + ' failed', err.data || err.message); }
  finally { busy(false); }
}
$('btnHealth').onclick = () => run('check agent', async () => { const h = await fetch(base() + '/healthz').then(r => r.json()); $('health').textContent = `gitea: ${h.gitea} · k3s: ${h.k3s}` + (h.gitea_oidc && h.gitea_oidc !== 'off' ? ' · gitea sign-in: keycloak' : ''); log('agent reachable', h); });
$('btnProvision').onclick = () => run('provision', async () => {
  const j = await call('POST', '/v1/envs', { learner: currentLearner(), lab: $('lab').value });
  log('job ' + j.job + ' ' + j.state);
  const done = await pollJob(j.job);
  log('job ' + done.state, done.steps.map(s => s.msg));
  if (done.state === 'failed') throw Object.assign(new Error('provision failed'), { data: done.error });
  await refresh(true);
});
$('btnStatus').onclick = () => run('refresh', () => refresh());
$('btnGrade').onclick = () => run('grade', async () => { const g = await call('POST', envPath() + '/grade'); renderGrade(g); log(`grade ${g.score}/${g.of}`); await refresh(true); });
$('btnResetRepo').onclick = () => run('reset repo', async () => { const r = await call('POST', envPath() + '/reset?scope=repo'); log('reset', r.reset); await refresh(true); });
$('btnResetAll').onclick = () => run('reset all', async () => { const r = await call('POST', envPath() + '/reset?scope=all'); log('reset', r.reset); await refresh(true); });
$('btnFixture').onclick = () => run('fixture broken-test', async () => { const r = await call('POST', envPath() + '/fixtures/broken-test'); log('fixture applied', r.applied); await refresh(true); });
$('btnDeprovision').onclick = () => run('deprovision', async () => {
  if (!confirm(`Deprovision ${currentLearner()} / ${$('lab').value}? This deletes the repo and namespace.`)) return;
  const j = await call('DELETE', envPath()); const done = await pollJob(j.job); log('deprovision ' + done.state, done.result || done.error); await refresh(true);
});
$('btnSignIn').onclick = signIn;
$('btnSignOut').onclick = signOut;
if (location.hostname === 'devops.mubita.digital') $('agent').value = PUBLIC_AGENT;   // public build: same file, hosted
(async () => {
  await finishSignIn(); renderWho();
  if (session.get()) { try { me = await call('GET', '/v1/me'); log('agent recognises ' + me.learner + (me.instructor ? ' (instructor)' : '')); } catch (e) { log('agent rejected the sign-in', e.data || e.message); } }
  if (session.get() || $('token').value) refresh(true); else log('sign in to see your environment');
})();
</script>
</body>
</html>
