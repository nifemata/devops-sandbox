# act_runner configuration (host mode).
log:
  level: info

runner:
  file: /data/.runner
  capacity: 2
  timeout: 1h
  fetch_timeout: 5s
  fetch_interval: 2s
  # "host" means: run the job's steps directly in this container, no job container.
  # That keeps the sandbox to one network and makes every step visible and plain.
  labels:
    - "host:host"
    - "ubuntu-latest:host"

cache:
  enabled: false

container:
  network: ""

host:
  workdir_parent: /work
